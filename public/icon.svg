<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B75" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#EAF4FF" />
    </linearGradient>
  </defs>

  <!-- Background Circle with Safe Margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="14" opacity="0.9" />

  <!-- Inner Concentric Circle -->
  <circle cx="256" cy="256" r="130" fill="#123B75" stroke="#ffffff" stroke-width="6" />

  <!-- 8 Spokes representing NSS Konark Sun Wheel -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="126" x2="256" y2="386" />
    <line x1="126" y1="256" x2="386" y2="256" />
    <line x1="164" y1="164" x2="348" y2="348" />
    <line x1="164" y1="348" x2="348" y2="164" />
  </g>

  <!-- Central Hub -->
  <circle cx="256" cy="256" r="42" fill="#1565C0" stroke="#ffffff" stroke-width="8" />

  <!-- NSS Acronym Typography -->
  <text x="256" y="266" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">NSS</text>
</svg>
